name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "DSH 任务通知 ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-body.md \
            --latest \
            release/DSH-Task-Notify-1.2.1.apk \
            release/dsh-plugin-task-notify-0.2.0.tgz \
            release/SHA256SUMS.txt
